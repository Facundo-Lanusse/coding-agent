[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-demo-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<1",
  "uvicorn>=0.51,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

