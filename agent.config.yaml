workspace: ./examples/fastapi_demo

llm:
  provider: openai
  model: ${OPENAI_MODEL:-gpt-5-mini}
  max_output_tokens: 8000
  store_responses: false

permissions:
  read:
    deny:
      - ".env"
      - ".env.*"
      - "**/*.pem"
      - "**/*.key"
      - "secrets/**"
      - ".git/**"
  write:
    deny:
      - ".env"
      - ".env.*"
      - ".git/**"
      - ".github/**"
      - "**/*.lock"
      - "secrets/**"

commands:
  deny:
    - "rm -rf"
    - "git push"
    - "git reset --hard"
    - "sudo"
    - "shutdown"
    - "reboot"
    - "mkfs"
    - "chmod 777"
  require_approval:
    - "pip install"
    - "python -m pip install"
    - "uv add"
    - "poetry add"
    - "git commit"
  allow_by_role:
    explorer:
      - "git status"
      - "git diff"
      - "git log"
      - "git show"
      - "git ls-files"
      - "git rev-parse"
      - "rg"
      - "find"
      - "ls"
      - "pwd"
    researcher: []
    implementer: []
    tester:
      - "python -m pytest"
      - "python -m compileall"
      - "python -m build"
      - "pytest"
      - "ruff"
      - "mypy"
      - "git status"
      - "git diff"
    reviewer:
      - "git status"
      - "git diff"

execution:
  timeout_seconds: 120
  max_output_chars: 50000
  max_read_bytes: 1000000
  max_list_entries: 1000
  max_agent_iterations: 20
  max_identical_actions: 2
  max_identical_failures: 2

rag:
  enabled: true
  collection_name: fastapi_docs
  collection_version: "2026-07-14"
  persistence_path: ./data/vector_store
  embedding_model: text-embedding-3-small
  embedding_dimension: 1536
  chunk_size_tokens: 400
  chunk_overlap_tokens: 60
  top_k: 6
  minimum_relevance: 0.10
  web_fallback: true
  allowed_url_domains:
    - fastapi.tiangolo.com
    - docs.pydantic.dev
    - pydantic.dev
    - docs.pytest.org

memory:
  enabled: true
  database_path: ./data/memory/project_memory.sqlite

observability:
  provider: langfuse
  enabled: true
  redact_sensitive_data: true
  capture_content: false
  max_payload_chars: 20000
